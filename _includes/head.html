<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<script src="{{ '/js/theme-init.js' | relative_url }}"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% unless page.url == "/" %}{{ page.title }} - {% endunless %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:image" content="{{ site.url }}{{ site.og_image }}">
<meta name="google-site-verification" content="{{ site.google_site_verification }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
{% feed_meta %}
